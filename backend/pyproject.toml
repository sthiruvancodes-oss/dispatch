[project]
name = "dispatch-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "browser-use>=0.11.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "pyvirtualdisplay>=3.0",
    "twilio>=9.0.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
